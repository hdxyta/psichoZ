<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inverso · blocos</title><link rel="stylesheet" href="../theme.css"><style>body{overflow:hidden}.game-wrap{max-width:580px}#tetris{display:flex;gap:14px;justify-content:center;align-items:start}#canvas{width:min(48vw,calc((100dvh - 150px)/2));height:min(96vw,calc(100dvh - 150px));background:#f2ece2;border:3px solid #090909;box-shadow:5px 5px 0 #f51d36}#menu{width:110px;font:12px monospace}#upcoming{width:90px;height:90px;border:2px solid #f51d36;background:#f2ece2}#menu p{margin:8px 0}#start,#stats{display:none}.touch-controls{gap:5px;margin:8px auto}.touch-controls button{padding:8px 11px}.source-note{padding:2px}</style><script src="../shared.js"></script></head><body><main class="game-wrap"><div id="tetris"><canvas id="canvas" aria-label="Tabuleiro de blocos"></canvas><aside id="menu"><p id="start"></p><p>PRÓXIMA</p><canvas id="upcoming" aria-label="Próxima peça"></canvas><p>Pontos <span id="score">0</span></p><p>Linhas <span id="rows">0</span> / 2</p><p>← → move<br>↑ gira<br>↓ desce<br>Espaço solta</p></aside></div><p data-game-status></p><div class="touch-controls"><button data-key="ArrowLeft" aria-label="Mover peça à esquerda">←</button><button data-key="ArrowUp" aria-label="Girar peça">↻</button><button data-key="ArrowRight" aria-label="Mover peça à direita">→</button><button data-key="ArrowDown" aria-label="Descer peça">↓</button><button id="drop">Soltar</button></div><footer class="source-note">Tetris · Jake Gordon · adaptação psicoZ · <a href="LICENSE" target="_blank">MIT</a></footer></main><script src="tetris.js"></script><script src="adapter.js"></script></body></html>
